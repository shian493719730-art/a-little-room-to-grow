/* A fan of twelve non-interactive backs: one draw, never twelve selectable rewards. */
.support-deck{position:relative;height:104px;max-width:330px;margin:23px auto 5px;pointer-events:none}
.card-back{position:absolute;left:50%;top:8px;width:55px;height:74px;background:#dfe9d5;border:1px solid #aebfa1;border-radius:6px;box-shadow:0 3px 6px #35544010;transform:translateX(calc(-50% + var(--offset))) translateY(var(--lift)) rotate(var(--tilt));display:grid;place-items:center}
.card-back::before{content:'';position:absolute;inset:5px;border:1px solid #bdccb0;border-radius:3px}
.card-back>span{font-size:18px;color:#a4b592}
.card-back.drawn-face{background:#f3eedb;border-color:#bdad83;z-index:2;transform:translateX(calc(-50% + var(--offset))) translateY(calc(var(--lift) - 10px)) rotate(var(--tilt))}
.card-back.drawn-face>span{color:#b7a478}
.deck-note{font-size:10px!important;color:var(--muted);text-align:center;margin:0 0 14px!important;letter-spacing:.15px}
.reveal-panel .pledger-footer{border-top:1px solid #d9e1cf;margin-top:17px;padding-top:11px;font-size:10px;line-height:1.65;font-weight:400;color:#6d7c67}
.pledger-footer a{color:inherit;text-decoration:none;overflow-wrap:break-word}
.pledger-footer a:hover{text-decoration:underline;text-underline-offset:3px}
.just-drawn .card-back{animation:deck-settle .6s ease both;animation-delay:var(--delay)}
.card-arrives{animation:card-arrive .7s ease both}
@keyframes deck-settle{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes card-arrive{from{opacity:.3;transform:translateY(10px) rotate(-1deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@media(max-width:780px){.support-deck{height:96px;margin-top:18px}.card-back{width:48px;height:67px}.deck-note{font-size:9px!important}.reveal-panel .pledger-footer{font-size:10px}}

<script id="game-engine">/* Source of the engine embedded into index.html by tests/build.mjs. No DOM or random calls. */
const Game = (() => {
  const COST = {restaurant:3, delivery:2, care:2, job:3};
  const LABEL = {restaurant:'餐厅班次',delivery:'配送工作',care:'照料花',rest:'休息',borrow:'透支',job:'寻找餐厅岗位'};
  const SUPPORT = {food:{name:'食物支持',effect:'每周初始可用体力 +2',icon:'▤'},cash:{name:'经济支持',effect:'初始准备金 +£120',icon:'£'},volunteer:{name:'志愿协助',effect:'每周末自动照料 +35，在自然衰减之前',icon:'✿'}};
  const freshCounts = () => ({restaurant:0,delivery:0,care:0,rest:0,borrow:0,job:0});
  function initial(support=null,round=1){
    return {week:1,round,support,money:40+(support==='cash'?120:0),flower:60,energy:support==='food'?9:7,capacity:support==='food'?9:7,debt:0,job:'employed',misses:0,exempt:false,counts:freshCounts(),income:0,startFlower:60,phase:'playing',revision:0,summary:null,history:[],supportRoll:null};
  }
  function reason(s,a){
    if(s.phase!=='playing')return '请先完成当前结算或结局';
    const c=s.counts;
    if(a==='restaurant'&&s.job==='unemployed')return '已失业：先寻找餐厅岗位';
    if(a==='job'&&s.job!=='unemployed')return '目前在职，失业后可用';
    if(a==='restaurant'&&c.restaurant>=2)return '本周已完成上限 2 次';
    if(a==='delivery'&&c.delivery>=3)return '本周已完成上限 3 次';
    if(a==='care'&&s.flower===0)return '花已死亡，无法复活';
    if(a==='care'&&c.care)return '本周已经照料过一次';
    if(a==='rest'&&c.rest)return '本周已经休息过一次';
    if(a==='rest'&&s.energy>=s.capacity)return '当前体力已达本周恢复上限';
    if(a==='borrow'&&s.week===4)return '最后一周不可透支';
    if(a==='borrow'&&c.borrow)return '本周已经透支过一次';
    if(COST[a]&&s.energy<COST[a])return `体力不足：需要 ${COST[a]}，当前 ${s.energy}`;
    if(!Object.hasOwn(LABEL,a))return '未知行动';
    return '';
  }
  function act(s,a,revision=s.revision){
    if(revision!==s.revision||reason(s,a))return s;
    const n={...s,counts:{...s.counts},revision:s.revision+1};
    n.counts[a]++;
    if(COST[a])n.energy-=COST[a];
    if(a==='restaurant'){n.money+=70;n.income+=70;n.job='employed';n.misses=0;}
    if(a==='delivery'){n.money+=35;n.income+=35;}
    if(a==='care')n.flower=Math.min(100,n.flower+35);
    if(a==='rest')n.energy=Math.min(n.capacity,n.energy+2);
    if(a==='borrow')n.energy+=2;
    if(a==='job'){n.job='reemployed';n.misses=0;n.exempt=true;}
    return n;
  }
  function end(s,revision=s.revision){
    if(s.phase!=='playing'||revision!==s.revision)return s;
    const n={...s,phase:'settlement',revision:s.revision+1};
    const before=s.flower;
    const care=s.support==='volunteer'&&before>0?Math.min(35,100-before):0;
    n.flower=before>0?Math.max(0,before+care-30):0;
    let jobEvent='';
    if(s.job!=='unemployed'&&!s.exempt&&s.counts.restaurant===0){
      n.misses=s.misses+1;
      if(n.misses>=2){n.job='unemployed';jobEvent='fired';}
      else {n.job='warning';jobEvent='warning';}
    }else if(s.job!=='unemployed'){n.misses=0;n.job=s.exempt?'reemployed':'employed';}
    const nextDebt=s.counts.borrow?3:0;
    const nextCapacity=7+(s.support==='food'?2:0)-nextDebt;
    n.summary={week:s.week,income:s.income,money:s.money,gap:Math.max(0,700-s.money),energy:s.energy,startFlower:s.startFlower,beforeFlower:before,supportCare:care,decay:before>0?Math.min(30,before+care):0,flower:n.flower,jobEvent,nextDebt,nextCapacity,final:s.week===4};
    return n;
  }
  function confirm(s,revision=s.revision){
    if(s.phase!=='settlement'||s.revision!==revision)return s;
    const history=[...s.history,s.summary];
    if(s.week===4)return {...s,phase:'ended',history,revision:s.revision+1};
    return {...s,week:s.week+1,energy:s.summary.nextCapacity,capacity:s.summary.nextCapacity,debt:s.summary.nextDebt,counts:freshCounts(),income:0,startFlower:s.flower,exempt:false,phase:'playing',history,summary:null,revision:s.revision+1};
  }
  function reveal(s,index){
    if(s.phase!=='ended'||s.round!==1||s.supportRoll!==null)return s;
    return {...s,supportRoll:['food','cash','volunteer'][Math.min(2,Math.max(0,index|0))],phase:'revealed',revision:s.revision+1};
  }
  function startSupport(s){
    if(s.phase!=='revealed'||!s.supportRoll)return s;
    return initial(s.supportRoll,2);
  }
  function outcome(s){return {bill:s.money>=700,flower:s.flower>0};}
  return {initial,reason,act,end,confirm,reveal,startSupport,outcome,LABEL,SUPPORT};
})();
if(typeof module!=='undefined')module.exports=Game;
</script>
<script id="game-support-cards">/* Community membership only. No person is assigned credit for the depicted support. */
const SupportCards = (() => {
  const source = 'https://www.cambridge-pledge.org/';
  // Names and affiliations are reproduced exactly as supplied by the user.
  const pledgers = Object.freeze([
    Object.freeze({name:'Clare Sutcliffe MBE', affiliation:'Co-founder, Code Club'}),
    Object.freeze({name:'Marcel Gehrung', affiliation:'CEO, Cyted Health'}),
    Object.freeze({name:'Edward Benthall', affiliation:'Jesus College, Cambridge'}),
    Object.freeze({name:'Kathryn Chapman', affiliation:'Innovate Cambridge'})
  ]);
  const kinds = Object.freeze(['food','cash','volunteer']);
  const deck = Object.freeze(kinds.flatMap((kind,k) => pledgers.map((person,p) => Object.freeze({
    id:`${kind}-${p}`, index:k*pledgers.length+p, kind, person:p,
    line:`${person.name} (${person.affiliation}) is also a Pledger.`
  }))));
  const hasDeck=s=>Array.isArray(s.supportDeck)&&s.supportDeck.length===12&&new Set(s.supportDeck).size===12&&s.supportDeck.every(id=>deck.some(c=>c.id===id));
  const canChoose=s=>s.phase==='ended'&&s.round===1&&s.supportRoll===null;
  function get(state){
    const kind=state.supportRoll||state.support;
    if(!kinds.includes(kind))return null;
    return deck.find(c=>c.id===state.supportCard&&c.kind===kind)||deck.find(c=>c.kind===kind);
  }
  function normalize(state){
    const card=get(state);
    // Old saves retain their already revealed support and receive a deterministic face.
    return card&&state.supportCard!==card.id?{...state,supportCard:card.id}:state;
  }
  function prepare(state,entropy){
    if(!canChoose(state)||hasDeck(state))return state;
    // Shuffle once, persist before showing the table. Card clicks never call randomness.
    const words=Array.isArray(entropy)||ArrayBuffer.isView(entropy)?Array.from(entropy):[];
    if(words.length<11||words.some(n=>!Number.isInteger(n)||n<0||n>4294967295))return state;
    const ids=deck.map(c=>c.id);
    for(let i=ids.length-1;i>0;i--){const j=Math.floor(words[11-i]/4294967296*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
    return {...state,supportDeck:ids};
  }
  function table(state){return hasDeck(state)?state.supportDeck.map(id=>deck.find(c=>c.id===id)):state.supportRoll||state.support?deck.slice():[];}
  function choose(state,slot){
    if(!canChoose(state)||!hasDeck(state)||!Number.isInteger(slot)||slot<0||slot>=12)return state;
    const card=table(state)[slot],next=Game.reveal(state,kinds.indexOf(card.kind));
    return next===state?state:{...next,supportCard:card.id,chosenSlot:slot};
  }
  function start(state){
    const next=Game.startSupport(state),card=get(state);
    return next===state?state:{...next,supportCard:card.id};
  }
  function retry(state){
    if(state.phase!=='ended'||state.round!==2)return state;
    return {...Game.initial(state.support,2),supportCard:get(state).id};
  }
  return Object.freeze({deck,pledgers,source,get,normalize,hasDeck,prepare,table,choose,start,retry});
})();
</script>

function note(key,lang,open=false){const n=data.notes[key];return `<aside class="research-note" aria-label="${text('research',lang)}" data-research="${key}"><span class="research-kicker">▧ ${text('research',lang)}</span><p>${esc(pick(n.text,lang))}</p><div class="research-citations">${citations(n.refs,lang)}</div><details data-reading-key="note-${key}" ${open?'open':''}><summary>${text('view',lang)}</summary>${n.design?`<p class="design-note"><b>${text('design',lang)}:</b> ${esc(pick(n.design,lang))}</p>`:''}${n.refs.map(id=>sourceBody(id,lang)).join('')}</details></aside>`;}

function entry(id,lang){const e=data.refs[id];return `<details class="reference-entry ${e.pending?'unverified':''}" id="ref-${id}" data-reading-key="ref-${id}"><summary><span class="ref-code">${id} </span><span>${esc(e.cite)}${e.pending?`<small>${text('pending',lang)}</small>`:''}</span></summary>${sourceBody(id,lang)}</details>`;}
function references(lang){return `<details class="full-references" data-reading-key="full-references"><summary>${text('references',lang)} <span>G1–G8 / R1–R7</span></summary><p>${text('allDetails',lang)}</p><h4>${text('gameRefs',lang)}</h4>${Object.keys(data.refs).filter(id=>id[0]==='G').map(id=>entry(id,lang)).join('')}<h4>${text('localRefs',lang)}</h4><p class="reference-provenance">${text('traced',lang)}</p>${['R1','R2','R3','R6','R7'].map(id=>entry(id,lang)).join('')}<section class="pending-references"><h4>⚑ ${text('pending',lang)}</h4><p>${text('pendingNote',lang)}</p>${['R4','R5'].map(id=>entry(id,lang)).join('')}</section></details>`;}

const cards=[

{title:['缺少的不只是钱','More than a shortage of money'],body:['时间贫困与幸福感、健康和生活安排有关。','Time poverty relates to wellbeing, health and everyday arrangements.'],note:['Perspective，综合已有研究。','A Perspective synthesising existing research.'],refs:['G4']},
{title:['小花代表生活的余地','The flower stands for room to live'],body:['有限资源会挤压社交、爱好和照护空间；资源不足不等于关爱不足。','Limited resources can crowd out social life, hobbies and care; limited resources do not mean limited love.'],note:['研究启发的叙事概括；小花是创作隐喻。','A research-inspired narrative summary; the flower is a creative metaphor.'],refs:['G5','G6']},
{title:['经济压力也有心理代价','Financial pressure has a psychological cost'],body:['一项纳入 136 项研究的系统综述发现，收入变化与心理健康和幸福感变化有关。','A systematic review including 136 studies found that income changes relate to changes in mental health and wellbeing.'],note:['136 指研究数量；证据确定性有限。','136 counts studies; evidence certainty was limited.'],refs:['G7']}

function background(lang){const english=lang==='en';return `<section class="ending-research" id="ending-background" aria-labelledby="background-title"><div class="reading-head"><span class="pixel-flower" aria-hidden="true">✿</span><span>${english?'A LITTLE CONTEXT':'留一点时间，了解背景'}</span></div><h3 id="background-title">${text('background',lang)}</h3><p class="brief-intro">${english?`Cambridge combines exceptional wealth with entrenched disadvantage. It is one of the most unequal cities in the UK${foot('R1','¹')}. Men in its most deprived areas can expect to live around 12 years less than men in the least deprived, and for women the gap is 11.8 years${foot('R2','²')}. Cambridge also has the fifth-lowest youth social mobility score of any local authority${foot('R3','³')}.`:`剑桥兼具非凡财富与根深蒂固的弱势处境。它是英国最不平等的城市之一${foot('R1','¹')}。最贫困地区男性的预期寿命比最不贫困地区男性短约 12 年，女性差距为 11.8 年${foot('R2','²')}。剑桥的青年社会流动性得分在地方行政区中排名倒数第五${foot('R3','³')}。`}</p><p class="brief-date-note">ⓘ ${text('briefNote',lang)}</p><section class="family-background"><p class="research-kicker">${text('focus',lang)}</p><h3>${text('families',lang)}</h3><p>${english?`Between April 2022 and March 2023, Cambridge City Council placed 131 applicant households with children or a pregnant member in emergency B&B accommodation, an increase of around 75% on the previous year.${foot('R6','⁶')}`:`2022 年 4 月至 2023 年 3 月，剑桥市议会将 131 户有孩子或孕妇的申请家庭安置在 B&B 紧急住宿中，比上一年度增加约 75%。${foot('R6','⁶')}`}</p><p>${citations(['R6'],lang,true)} · p. 15, Table 14</p><p>${text('fiction',lang)}</p></section><h3>${text('cardsTitle',lang)}</h3><div class="interpretation-cards">${cards.map((c,i)=>`<article class="interpretation-card"><span class="pixel-count" aria-hidden="true">0${i+1} / ✿</span><h4>${esc(pick(c.title,lang))}</h4><p>${esc(pick(c.body,lang))}</p><p class="interpretation-limit">${esc(pick(c.note,lang))}</p><div>${citations(c.refs,lang,true)}</div></article>`).join('')}</div>${parameters(lang)}${references(lang)}</section>`;}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function text(key,lang,...args){return copy[key][lang==='en'?1:0].replace(/\{(\d+)\}/g,(_,i)=>args[i]??'');}
function intro(lang,logo,hasProgress){const t=(k,...a)=>text(k,lang,...a);return `<div class="welcome-hero"><div class="welcome-copy"><p class="eyebrow">${t('introKicker')}</p><h1 id="welcome-title">${t('introTitle')}</h1><p class="welcome-lead">${t('introLead')}</p><p>${t('about')}</p><p>${t('purpose')}</p><div class="welcome-actions"><button class="primary" data-cmd="intro-start">${t(hasProgress?'resume':'start')}</button><a class="welcome-give" href="${links.pledge}" target="_blank" rel="noopener noreferrer">${t('give')}</a></div><p class="welcome-duration">${t('duration')}</p></div><div class="welcome-visual"><canvas id="welcome-room" width="960" height="720" role="img"></canvas><div><span aria-hidden="true">✿</span> ${lang==='en'?'A Little Room to Grow':'留一点，给花'}</div></div></div><div class="welcome-route" aria-hidden="true">${['step1','step2','step3'].map((k,i)=>`<span><b>0${i+1}</b> ${t(k)}</span>`).join('')}</div><section class="welcome-purpose"><div><p class="eyebrow">${t('aboutTitle')}</p><h2>${t('whyTitle')}</h2></div><div><p>${t('why')}</p><p>${t('whyMore')}</p></div></section><section class="welcome-community"><h2>${t('communityTitle')}</h2><p>${t('communityNote')}</p><div class="community-members">${SupportCards.pledgers.map(p=>`<a href="${links.home}" target="_blank" rel="noopener noreferrer" lang="en"><strong>${esc(p.name)}</strong><span>${esc(p.affiliation)}</span></a>`).join('')}</div></section><details class="welcome-provenance"><summary>${t('sources')}</summary><p>${t('context')}</p><p>${t('abstraction')}</p><a href="${links.home}" target="_blank" rel="noopener noreferrer">${t('official')}</a><br><a href="${links.brief}" target="_blank" rel="noopener noreferrer">${t('event')}</a></details><div class="welcome-bottom"><p>${t('context')}</p><button class="primary" data-cmd="intro-start">${t(hasProgress?'resume':'start')}</button></div>`;}
function cards(state,lang,logo,locked=false){const t=(k,...a)=>text(k,lang,...a);return `<div class="support-card-grid">${SupportCards.table(state).map((c,i)=>{const person=SupportCards.pledgers[c.person],chosen=state.supportCard===c.id;return `<button class="support-card-back ${chosen?'chosen-card':''}" data-cmd="choose-card" data-slot="${i}" ${locked?'disabled':''} aria-label="${esc(t(locked?'cardLockedLabel':'cardLabel',i+1,person.name))}"><span class="card-back-top"><span>${String(i+1).padStart(2,'0')} / 12</span><span aria-hidden="true">✦</span></span><img src="${logo}" alt="The Cambridge Pledge" width="150" height="72"><span class="card-member" lang="en"><strong>${esc(person.name)}</strong><span>(${esc(person.affiliation)})</span><span>is also a Pledger.</span></span><span class="card-turn">${t(locked?(chosen?'selected':'unselected'):'cardAction')} ${locked?'':'↗'}</span></button>`;}).join('')}</div>`;}
function table(state,lang,logo){return `<p class="eyebrow">${text('tableKicker',lang)}</p><h2 id="modal-title">${text('tableTitle',lang)}</h2><p>${text('tableText',lang)}</p><p class="table-community-note">${text('tableNote',lang)}</p>${cards(state,lang,logo)}<p class="table-save-note">▣ ${text('tableLocked',lang)}</p><button class="secondary" data-cmd="back-result">${text('backResult',lang)}</button>`;}
const variant=s=>s.money>=700?(s.flower>0?'win':'paid'):(s.flower>0?'flower':'both');
function ending(state,lang){const v=variant(state),t=(k,...a)=>text(k,lang,...a),bill=state.money>=700,flower=state.flower>0;return {variant:v,kicker:t(v+'Kicker'),title:t(v+'Title'),story:t(v+'Story'),documents:`<div class="ending-documents ${v}"><article class="bill-document ${bill?'receipt-paid':'notice-open'}"><div class="document-rule"></div><p class="document-label">${t(bill?'receipt':'notice')}</p><div class="document-stamp">${bill?'✓':'!'} ${t(bill?'paid':'unpaid')}</div><dl><div><dt>${t('fund')}</dt><dd>£${state.money}</dd></div><div><dt>${t('target')}</dt><dd>£700</dd></div><div class="document-total"><dt>${t(bill?'balance':'gap')}</dt><dd>£${bill?state.money-700:700-state.money}</dd></div></dl></article><article class="flower-document ${flower?'still-growing':'dry-stems'}"><p class="document-label">${t(flower?'flowerAlive':'flowerDead')}</p><div class="ending-flower" aria-hidden="true"><i class="stem"></i>${flower?'<i class="bloom">✿</i><i class="leaf leaf-a"></i><i class="leaf leaf-b"></i>':'<i class="branch branch-a"></i><i class="branch branch-b"></i><i class="petal petal-a"></i><i class="petal petal-b"></i>'}<i class="pot"></i></div><strong>${state.flower} / 100</strong><p>${t(flower?'alive':'irreversible')}</p></article></div>`};}
return {text,intro,table,cards,ending,variant,links,keys:Object.keys(copy)};
})();

 for(let i=0;i<9;i++){line(28+i*26,154-i*1.4,54+i*27,238-i*3.2,'#cbb087',1);r(52+i*22,176+i%3*11,10,1,'#c7aa81');}
 // A little notebook, mug and pen retain the sense of everyday life.
 poly([[30,145],[67,141],[78,159],[40,165]],'#8fa69a');line(40,148,65,145,'#e7ecd9');r(262,134,19,20,'#a4bab0');r(260,130,23,5,'#c6d6c4');r(281,137,7,10,'#8fa79b');r(283,139,3,6,'#e7eadb');line(249,176,274,191,'#6d8c7e',3);
 const paperY=152-(1-ease(p*2.4))*26;
 c.save();c.translate(120,paperY);c.rotate(-.13);

 for(let i=0;i<(paid?1:3);i++){const offset=(i-1)*4*ease(p*2);r(-48+offset,5+i*4,119,76,'#c5b396');r(-47+offset,4+i*4,117,74,'#f5e9cf');line(-47+offset,4+i*4,11+offset,39+i*4,'#d6c7a8',1);line(70+offset,4+i*4,11+offset,39+i*4,'#d6c7a8',1);}

 c.save();c.translate(7,stampY);c.rotate(paid?-.1:.05);r(-21,-11,43,25,paid?'#6b9076':'#b38c60');r(-19,-9,39,21,paid?'#edf2df':'#fbefdb');

$('#round-label').textContent=tr(state.round===1?'round1':'round2');$('#week-label').innerHTML=tr('week',state.week);$('#week-dots').innerHTML=[1,2,3,4].map(w=>`<i class="${w<state.week?'done':w===state.week?'current':''}"></i>`).join('');$('#energy').innerHTML=`${state.energy} <small>/ ${state.capacity}</small>`;$('#money').textContent='£'+state.money;$('#flower').innerHTML=`${state.flower} <small>/ 100</small>`;$('#capacity-note').textContent=tr('capacity',state.support==='food'?tr('foodCapacity'):'',state.debt?tr('debtCapacity'):'',state.capacity);$('#gap').textContent=state.money>=700?tr('ready'):tr('remaining',700-state.money);$('#flower-note').textContent=tr(state.flower===0?'deadNote':'decayNote');$('#energy-meter').style.width=Math.min(100,state.energy/state.capacity*100)+'%';$('#money-meter').style.width=Math.min(100,state.money/700*100)+'%';$('#flower-meter').style.width=state.flower+'%';
$('#support-strip').innerHTML=state.support?`<div class="support-strip">${tr('supportNow',supportName(state.support),supportEffect(state.support))}</div>`:'';$('#jobline').innerHTML=`${tr('jobLabel')}: <strong>${tr(state.job)}</strong> · ${state.exempt?tr('jobExempt'):state.job==='unemployed'?tr('jobUnlocked'):tr('jobProgress',state.counts.restaurant)}`;$('#alerts').innerHTML=alerts();$('#storage-error').hidden=!storageError;renderFeedback();attachThumb();
const focusAction=document.activeElement?.dataset.action;$('#actions').innerHTML=actionKeys.map(a=>{const reason=why(a);return `<div class="action-cell"><button class="action" data-action="${a}" data-rev="${state.revision}" aria-disabled="${!!reason}" aria-describedby="why-${a}"><canvas class="action-icon" width="64" height="64" data-icon="${a}" aria-hidden="true"></canvas><span class="action-copy"><span class="action-title">${tr(a)}</span><span class="cost">${tr(a+'Cost')}</span><span class="reason" id="why-${a}">${esc(reason||tr(a+'Limit',state.counts[a]))}</span></span></button>${Literature.note(a,preferences.lang,readingOpen.has('note-'+a))}</div>`;}).join('');document.querySelectorAll('[data-icon]').forEach(c=>PixelScene.icon(c,c.dataset.icon));if(focusAction)document.querySelector(`[data-action="${focusAction}"]`)?.focus({preventScroll:true});
$('#end-week').innerHTML=`<span>${tr('endWeek')}</span><span aria-hidden="true">→</span>`;$('#end-week').dataset.rev=state.revision;$('#end-week').disabled=state.phase!=='playing';updateFilmCopy();PixelScene.room($('#room'),state);renderWelcome();}
function updateFilmCopy(){if(!filmAction)return;$('#film').setAttribute('aria-label',tr('filmAria',tr(filmAction)));$('#film-label').textContent=tr(filmKey(filmAction),tr(filmAction));$('#skip-film').textContent=tr('skipFilm');}
function stopFilm(hide=true){cancelAnimationFrame(filmFrame);filmDone=true;if(hide){$('#action-film').hidden=true;filmAction=null;renderFeedback();}PixelScene.room($('#room'),state);}
function animate(a){cancelAnimationFrame(filmFrame);filmAction=a;filmDone=false;$('#action-film').hidden=false;updateFilmCopy();filmStarted=performance.now();renderFeedback();attachThumb();
const frame=now=>{const p=Math.min(1,(now-filmStarted)/2600);PixelScene.film($('#film'),a,p);PixelScene.film($('#film-thumb'),a,p);PixelScene.room($('#room'),state,{time:p*2.6});$('#action-film .film-progress i').style.width=(p*100)+'%';if(p<1)filmFrame=requestAnimationFrame(frame);else{filmDone=true;PixelScene.room($('#room'),state);}};filmFrame=requestAnimationFrame(frame);}
function action(a,rev){if(why(a)){feedback={error:true,a};renderFeedback();return;}const before=state;state=Game.act(state,a,rev);if(state===before)return;feedback={a,before,after:state};save();render();SoundFX.play(a);$('#feedback').classList.remove('pulse');void $('#feedback').offsetWidth;$('#feedback').classList.add('pulse');for(const key of['energy','money','flower'])if(before[key]!==state[key]){const el=$('#res-'+key);el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}animate(a);}
function openDialog(type,id){const wasOpen=modal.open;dialogView={type,id};if(!wasOpen)lastFocus=document.activeElement;drawDialog();if(!wasOpen)modal.showModal();modal.scrollTop=0;const focus=content.querySelector('[autofocus]')||content.querySelector('button,a');focus?.focus({preventScroll:true});}
function closeDialog(){stopEndingFilm();if(modal.open)modal.close();dialogView=null;lastFocus?.focus({preventScroll:true});}
function settlementHTML(){const v=state.summary;let warnings='';if(v.jobEvent==='warning')warnings=alert(tr('firstWarning'),tr(v.final?'finalWarningText':'firstWarningText'),true);if(v.jobEvent==='fired')warnings=alert(tr('firedTitle'),tr('firedText'),true);if(v.flower===0)warnings+=alert(tr('flowerDeadTitle'),tr('flowerDeadText'),true);
const rows=[[tr('income'),'+£'+v.income],[tr('billFund'),'£'+v.money+' / £700'],[tr('billGap'),'£'+v.gap],[tr('unusedEnergy'),v.energy],[tr('flowerBefore'),v.startFlower+' → '+v.beforeFlower],[tr('supportBefore'),state.support==='volunteer'?tr('autoCare',v.supportCare):tr('noAutoCare')],[tr('decay'),tr('decayValue',v.decay)],[tr('flowerAfter'),`${v.beforeFlower} + ${v.supportCare} − ${v.decay} = ${v.flower}`]];
return `<p class="eyebrow">${tr('settlementKicker',v.week)}</p><h2 id="modal-title">${tr('settlementTitle',v.week)}</h2>${warnings}<div class="settle-grid">${rows.map(([a,b])=>`<div><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="calculation"><b>${tr(v.final?'fourWeeksOver':'nextEnergy')}</b><br>${v.final?tr('finalCalculation'):tr('nextCalculation',state.support==='food'?tr('foodCapacity'):'',v.nextDebt,v.nextCapacity)+'<br>'+tr('unusedNote',v.energy)}<br>${(state.support?tr('supportNow',supportName(state.support),supportEffect(state.support)):tr('supportNone'))}${state.support==='cash'?'<br>'+tr('cashApplied'):''}</div><p class="small">${tr('settledOnce')}</p><button class="primary" data-cmd="confirm" data-rev="${state.revision}" autofocus>${v.final?tr('confirmEnd'):tr('confirmWeek',v.week+1)}</button>`;}
function pledgeHTML(){return `<section class="pledge"><p class="eyebrow">${tr('pledgeKicker')}</p><h3>${tr('pledgeTitle')}</h3><p>${tr('pledgeText')}</p><div class="quote-placeholder">${tr('quotePlaceholder')}</div><a class="primary" href="https://www.cambridge-pledge.org/pledge" target="_blank" rel="noopener">${tr('pledgeCTA')}</a><p class="small">${tr('pledgeNote')}</p></section>`;}
function resultHTML(){const o=Game.outcome(state),ending=Journey.ending(state,preferences.lang);return `<p class="eyebrow">${tr('outcomeKicker',state.round)} · ${ending.kicker}</p><h2 id="modal-title" class="distinct-ending-title">${ending.title}</h2><figure class="ending-cinema ${ending.variant}"><canvas id="ending-film" width="1200" height="504" role="img" aria-label="${esc(journeyText('endingFilmLabel',ending.title.replace(/\n/g,' ')))}"></canvas><figcaption><span>${ending.kicker}</span><div><button data-cmd="ending-pause" id="ending-pause">${journeyText('pauseEnding')}</button><button data-cmd="ending-replay">${journeyText('replayEnding')}</button></div></figcaption></figure>${ending.documents}<p class="ending-explanation">${ending.story}</p><p class="reveal-copy">${tr(state.round===1?'revealTruth':o.bill&&o.flower?'winReflection':'loseReflection')}</p><div class="result-tools"><button data-cmd="all-sources">${journeyText('endingReferences')}</button><button data-cmd="restart-prompt">${tr('restartRound1')}</button></div><section class="result-next" id="support-entry">${state.round===1?`<p>${journeyText('nextSupportLead')}</p><button class="badge result-support-badge" data-cmd="reveal" autofocus><img src="${LOGO}" alt="The Cambridge Pledge"><span>${tr('badgeAction')}<br><b>${tr('badgeReveal')}</b></span></button>`:`<a class="primary result-pledge-cta" href="https://www.cambridge-pledge.org/pledge" target="_blank" rel="noopener">${tr('pledgeCTA')}</a><button class="secondary" data-cmd="retry-support">${tr('retrySupport')}</button>`}</section>`;}

function supportHTML(){const kind=state.supportRoll,e=Game.SUPPORT[kind],card=SupportCards.get(state);return `<p class="eyebrow">${tr('supportKicker')}</p><h2 id="modal-title">${journeyText('supportReviewTitle')}</h2><div class="reveal-panel ${justRevealed?'card-arrives':''}"><p class="research-kicker">${journeyText('selected')}</p><span style="font-size:32px">${e.icon}</span><h3>${supportName(kind)}</h3><p><b>${supportEffect(kind)}</b></p><p>${tr(kind+'Description')}</p><div class="pledger-footer"><a href="${SupportCards.source}" target="_blank" rel="noopener" lang="en">${esc(card.line)}</a></div></div><section class="support-research-step"><h3>${journeyText('supportContextTitle')}</h3><p>${journeyText('supportContextIntro')}</p>${Literature.note(kind,preferences.lang,readingOpen.has('note-'+kind))}<p class="support-research-note">${readingText('supportNote')}</p><details class="support-context" data-reading-key="support-background"><summary>${journeyText('contextExpand')}</summary>${Literature.background(preferences.lang)}</details><details class="support-context"><summary>${journeyText('communityExpand')}</summary>${pledgeHTML()}</details><details class="support-context locked-table"><summary>${journeyText('cardTableExpand')}</summary>${Journey.cards(state,preferences.lang,LOGO,true)}</details></section><div class="support-confirm"><p>${journeyText('confirmSupportNote')}</p><button class="primary" data-cmd="start-support" autofocus>${journeyText('confirmSupport')}</button></div>`;}

function stopEndingFilm(){cancelAnimationFrame(endingFrame);endingFrame=0;}
function startEndingFilm(restart=true){stopEndingFilm();if(restart)endingElapsed=0;endingPaused=false;endingStarted=performance.now()-endingElapsed;const canvas=$('#ending-film'),variant=Journey.variant(state);EndingFilm.draw(canvas,variant,endingElapsed);const frame=now=>{if(!modal.open||dialogView?.type!=='result'||endingPaused)return;endingElapsed=now-endingStarted;EndingFilm.draw(canvas,variant,endingElapsed);endingFrame=requestAnimationFrame(frame);};endingFrame=requestAnimationFrame(frame);const b=$('#ending-pause');if(b)b.textContent=journeyText('pauseEnding');}
function toggleEndingFilm(){if(endingPaused){startEndingFilm(false);return;}stopEndingFilm();endingPaused=true;$('#ending-pause').textContent=journeyText('resumeEnding');}

function sourcesHTML(){return `<p class="eyebrow">${tr('sourcesKicker')}</p><h2 id="modal-title">${readingText('readTitle')}</h2><p>${readingText('readIntro')}</p>${Literature.background(preferences.lang)}<div class="calculation"><b>${tr('makingTitle')}</b><p>${tr('makingText')}</p><p>${tr('makingPrivacy')}</p></div><button class="secondary" data-cmd="close">${tr('close')}</button>`;}
function drawDialog(){stopEndingFilm();if(!dialogView)return;const {type,id}=dialogView;modal.dataset.view=type;modal.dataset.mandatory=String(['summary','result','support','card-table','restart'].includes(type));$('#modal-close').hidden=modal.dataset.mandatory==='true';content.innerHTML=type==='summary'?settlementHTML():type==='result'?resultHTML():type==='card-table'?Journey.table(state,preferences.lang,LOGO):type==='support'?supportHTML():type==='sources'?sourcesHTML():`<p class="eyebrow">${tr('restartKicker')}</p><h2 id="modal-title">${tr('restartTitle')}</h2><p>${tr('restartText')}</p><button class="primary" data-cmd="restart-now">${tr('restartConfirm')}</button><button class="secondary" data-cmd="cancel-restart">${tr('restartCancel')}</button>`;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===preferences.lang);b.setAttribute('aria-pressed',String(b.dataset.lang===preferences.lang));});content.querySelectorAll('[data-reading-key]').forEach(el=>{if(readingOpen.has(el.dataset.readingKey))el.open=true;});if(type==='result')startEndingFilm();}
function syncModal(){if(showWelcome)return;if(state.phase==='settlement')openDialog('summary');else if(state.phase==='ended')openDialog(SupportCards.hasDeck(state)&&state.supportRoll===null?'card-table':'result');else if(state.phase==='revealed')openDialog('support');}
modal.addEventListener('cancel',e=>{if(modal.dataset.mandatory==='true')e.preventDefault();else if(state.phase==='ended'){e.preventDefault();openDialog('result');}else dialogView=null;});
document.addEventListener('click',e=>{const lang=e.target.closest('[data-lang]');if(lang){const activeLang=lang.dataset.lang;preferences.lang=activeLang;savePreferences();render();drawDialog();(modal.open?modal:document).querySelector(`[data-lang="${activeLang}"]`)?.focus({preventScroll:true});return;}
const ref=e.target.closest('[data-ref]');if(ref){e.preventDefault();const target=content.querySelector('#ref-'+ref.dataset.ref);if(target){let parent=target;while(parent&&parent!==content){if(parent.tagName==='DETAILS'){parent.open=true;readingOpen.add(parent.dataset.readingKey);}parent=parent.parentElement;}target.querySelector('summary')?.focus({preventScroll:true});target.scrollIntoView({behavior:'instant',block:'start'});}return;}
const jump=e.target.closest('[data-read-jump]');if(jump){const target=content.querySelector('#'+jump.dataset.readJump);if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({behavior:'instant',block:'start'});}return;}
const cmd=e.target.closest('[data-cmd]')?.dataset.cmd;if(!cmd)return;
if(cmd==='intro-start'){introAccepted=true;showWelcome=false;save();render();window.scrollTo({top:0,behavior:'instant'});$('#game-main').focus({preventScroll:true});syncModal();return;}
if(cmd==='intro-open'){stopFilm();closeDialog();showWelcome=true;render();window.scrollTo({top:0,behavior:'instant'});$('#welcome-title').setAttribute('tabindex','-1');$('#welcome-title').focus({preventScroll:true});return;}
if(cmd==='back-result'){openDialog('result');return;}
if(cmd==='ending-pause'&&dialogView?.type==='result'){toggleEndingFilm();return;}if(cmd==='ending-replay'&&dialogView?.type==='result'){startEndingFilm();return;}
if(cmd==='close'){if(state.phase==='ended')openDialog('result');else closeDialog();return;}if(cmd==='all-sources'){openDialog('sources');return;}if(cmd==='restart-prompt'){openDialog('restart');return;}if(cmd==='cancel-restart'){closeDialog();syncModal();return;}
if(cmd==='restart-now'){stopFilm();SoundFX.stop();state=Game.initial();introAccepted=false;showWelcome=true;readingOpen.clear();feedback=null;save();closeDialog();render();return;}
if(cmd==='confirm'){const b=e.target.closest('[data-cmd]'),old=state;state=Game.confirm(state,Number(b.dataset.rev));if(old===state)return;feedback=null;save();closeDialog();render();if(state.phase==='ended')SoundFX.play(Game.outcome(state).bill&&Game.outcome(state).flower?'success':'ending');syncModal();return;}
if(cmd==='reveal'){if(state.phase!=='ended'||state.round!==1||state.supportRoll!==null)return;if(!SupportCards.hasDeck(state)){const random=new Uint32Array(11);crypto.getRandomValues(random);state=SupportCards.prepare(state,random);save();}openDialog('card-table');return;}
if(cmd==='choose-card'){const slot=Number(e.target.closest('[data-slot]')?.dataset.slot),old=state;state=SupportCards.choose(state,slot);if(old===state)return;justRevealed=true;readingOpen.add('note-'+state.supportRoll);save();render();SoundFX.play('reveal');openDialog('support');justRevealed=false;return;}
if(cmd==='start-support'){const old=state;state=SupportCards.start(state);if(old===state)return;stopFilm();feedback=null;save();closeDialog();render();return;}
if(cmd==='retry-support'&&state.phase==='ended'&&state.round===2){stopFilm();state=SupportCards.retry(state);feedback=null;save();closeDialog();render();}
});
$('#actions').addEventListener('click',e=>{const actionButton=e.target.closest('[data-action]');if(actionButton)action(actionButton.dataset.action,Number(actionButton.dataset.rev));});
$('#end-week').addEventListener('click',e=>{const old=state;state=Game.end(state,Number(e.currentTarget.dataset.rev));if(state===old)return;stopFilm();save();render();SoundFX.play('settlement');openDialog('summary');});
$('#skip-film').onclick=()=>stopFilm();$('#sources-button').onclick=()=>openDialog('sources');$('#restart').onclick=()=>openDialog('restart');$('#sound-toggle').onclick=()=>{preferences.sound=!preferences.sound;savePreferences();render();if(preferences.sound)SoundFX.play('toggle');};$('#volume').addEventListener('input',e=>{preferences.volume=Number(e.target.value)/100;savePreferences();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)SoundFX.stop();});
document.addEventListener('toggle',e=>{const key=e.target.dataset?.readingKey;if(key){if(e.target.open)readingOpen.add(key);else readingOpen.delete(key);}},true);
savePreferences();save();render();syncModal();
})();
</script>
