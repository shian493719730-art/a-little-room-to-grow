renderer.domElement.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvitation();}});
let roomActive=true;
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===window.parent&&e.data?.type==='cambridge-room-active')roomActive=e.data.active===true;});
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;startX=lastX=e.clientX;startY=lastY=e.clientY;moved=0;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.0025;pitch=THREE.MathUtils.clamp(pitch-dy*.0025,-1.42,.65);lastX=e.clientX;lastY=e.clientY;}else{const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);renderer.domElement.style.cursor=raycaster.intersectObject(screen).length?'pointer':'grab';}});
renderer.domElement.addEventListener('pointerup',e=>{dragging=false;if(moved<7){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);if(raycaster.intersectObject(screen).length)openInvitation();}});
renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;});
